[project]
name = "RSC-Discord-Bot"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp-retry>=2.9.1",
    "httpx>=0.28.1",
    "openai>=2.28.0",
    "pandas>=3.0.2",
    "pillow>=13.0.0",
    "pip>=26.1.2",
    "pydantic>=2.11.10",
    "python-ballchasing>=0.3.0",
    "pytz>=2026.1.post1",
    "red-discordbot==3.5.24",
    "replay-parser",
    "rich>=14.2.0",
    "rscapi>=2.1.9",
    "sentry-sdk>=2.73.0",
    "trio>=0.33.0",
    "validators>=0.35.0",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    # Used directly by tests/conftest.py. It previously arrived as a transitive
    # of the langchain stack, so removing that stack orphaned it.
    "python-dotenv>=1.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
]
# Third-party imports of the one-off utilities in scripts/. The bot itself does not need them.
scripts = [
    "imutils>=0.5.4",
    "matplotlib>=3.11.2",
    "numpy>=2.4.4",
    "opencv-python>=5.0.0.93",
    "psd-tools>=1.26.0",
    "pytesseract>=0.3.13",
    "requests>=2.34.2",
    "scipy>=1.17.1",
]

[tool.mypy]
check_untyped_defs = true
mypy_path = [
    "/home/xentrick/dev/python-replay-parser",
    "/home/xentrick/dev/rsc-api-client",
    "/home/xentrick/dev/python-ballchasing",
]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 140
indent-width = 4
exclude = ["data/"]

[tool.ruff.lint]
select = [
    "ANN",   # annotations
    "ASYNC", # async
    "B",     # bugbear
    "C4",    # comprehensions
    "COM",   # trailing comma
    "DJ",    # Django
    "DTZ",   # naive datetime
    "E",     # style errors
    "EXE",   # shebang
    "F",     # flakes
    "FLY",   # string formatting
    "FURB",  # refurbishing
    "G",     # logging format
    # "I", # import sorting
    "INT",  # gettext
    "ISC",  # string concatenation
    "LOG",  # logging
    "N",    # naming
    "PERF", # performance
    "PGH",  # pygrep-hooks
    "PIE",  # miscellaneous
    "PL",   # pylint
    "PTH",  # path
    "PYI",  # typing stubs
    "Q",    # quotes
    "RSE",  # raise
    "RUF",  # Ruff
    "S",    # security
    "SLOT", # __slots__
    "SIM",  # simplify
    "T10",  # debugger
    "TC",   # type-checking
    "TID",  # tidy imports
    "UP",   # upgrade
    "W",    # style warnings
    "YTT",  # sys.version
]
ignore = [
    "ANN002",  # Missing type annotation for `*args`
    "ANN003",  # Missing type annotation for `**kwargs`
    "ANN201",  # Missing return type annotation
    "ANN202",  # Missing return type annotation
    "ANN204",  # Missing return type annotation for special method `__init__`
    "B904",    # Within an except clause, raise exceptions with raise ... from err or raise ... from None to distinguish them from errors in exception handling
    "COM812",  # Trailing comma missing
    "DJ008",   # Model does not define `__str__` method
    "G004",    # Logging statement uses f-string
    "N806",    # Variable in function should be lowercase
    "PLC0414", # Import alias does not rename original package
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments to function call
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments in function declaration
    "PLR2004", # Magic value used in comparison
    "PLW2901", # Outer for loop variable overwritten by inner for loop target
    "S324",    # Probable use of insecure hash functions in `hashlib`
    "SIM105",  # Use `contextlib.suppress(ValueError)` instead of `try`-`except`-`pass`
]

[tool.ruff.lint.per-file-ignores]
# Discord message copy. Wrapping would insert line breaks into the rendered output.
"rsc/const.py" = ["E501"]
# Tests assert freely, take unannotated pytest fixtures, and use fake credentials and non-crypto randomness.
"tests/**" = ["S101", "ANN", "S105", "S106", "S107", "S311"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"


[tool.codespell]
skip = ["*.json"]
# "ot" is the overtime field abbreviation in replay summaries, and "optin" the /devleague optin command, not typos.
ignore-words-list = "ptd,oce,nd,cros,recuse,checkin,optin,alph,ot"

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
timeout = 10
# Integration tests hit the live staging server, so their results depend on
# infrastructure we do not control. Run them deliberately: `pytest -m integration`.
# The aiohttp-json-rpc and anyio pytest plugins arrive with Red and openai, and no test
# uses them. Both use pytest APIs that pytest 10 removes, and Red's pins stop us upgrading.
addopts = "-m 'not integration' -p no:aiohttp-json-rpc -p no:anyio"
filterwarnings = [
    "ignore::DeprecationWarning:aiohttp_json_rpc",
    "ignore::DeprecationWarning:aiohttp",
]
markers = [
    "integration: marks tests that make real API calls to the staging server",
]

# Opt in with `uv run pytest --cov`. Not on by default, since it slows every run.
[tool.coverage.run]
source = ["rsc"]
# Written to the system temp dir, so a run never leaves a stray .coverage in the repo
data_file = "/tmp/rsc.coverage"

[tool.coverage.report]
show_missing = true
skip_empty = true
# Only code that can never run under test. Untested code, such as slash command
# handlers, stays in the report so the number shows what is really covered.
exclude_also = [
    # Imports for type checkers only
    "if TYPE_CHECKING:",
    # Interface stubs with no body to run
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ty.environment]
extra-paths = [
    "/home/xentrick/dev/python-replay-parser",
    "/home/xentrick/dev/rsc-api-client",
]

[tool.uv.sources]
replay-parser = { git = "https://github.com/xentrick/python-replay-parser.git" }
python-ballchasing = { git = "https://github.com/xentrick/python-ballchasing.git" }
# The rsc-api-client repo publishes a distribution named "rscapi" (see its
# pyproject `name`). Keying this on the repo name meant nothing ever resolved it.
rscapi = { git = "https://github.com/RSC-NA/rsc-api-client.git" }
