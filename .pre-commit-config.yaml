repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: debug-statements

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.69
    hooks:
      - id: ty

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      # Keep uv.lock in sync with pyproject.toml
      - id: uv-lock
      # uv-audit is intentionally not run here: Red-DiscordBot pins aiohttp, click,
      # idna, markdown, orjson and pygments with `==`, so the audit can never pass.
      # Run `uv audit` by hand to re-check whether Red has relaxed those pins.
      #
      # Re-sync the venv after checkout/pull/rebase
      - id: uv-sync
      # Mirror uv.lock into requirements.txt as a backup install source
      - id: uv-export
        name: uv-export (runtime)
        alias: uv-export
        args: ["--frozen", "--no-dev", "--output-file=requirements.txt", "--quiet"]
      # Same, but including the dev dependency group
      - id: uv-export
        name: uv-export (dev)
        alias: uv-export-dev
        args: ["--frozen", "--output-file=requirements-dev.txt", "--quiet"]
