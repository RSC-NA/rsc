repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: debug-statements

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.93
    hooks:
      - id: ty

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.17
    hooks:
      # Keep uv.lock in sync with pyproject.toml
      - id: uv-lock
      # uv-audit is not run here. Red-DiscordBot pins aiohttp, brotli, idna, markdown,
      # orjson and pygments with `==` at vulnerable versions; the [tool.uv] overrides
      # in pyproject.toml lift those pins so `uv audit` passes. Run it by hand.
      #
      # Re-sync the venv after checkout/pull/rebase. Every group, because the ty hook
      # type-checks scripts/, whose imports (pandas, requests) live in the scripts group:
      # the default sync removed them and the next commit failed ty.
      - id: uv-sync
        args: ["--locked", "--all-groups"]
      # Mirror uv.lock into requirements.txt as a backup install source
      - id: uv-export
        name: uv-export (runtime)
        alias: uv-export
        args: ["--frozen", "--no-dev", "--output-file=requirements.txt", "--quiet"]
      # Same, but including the dev dependency group
      - id: uv-export
        name: uv-export (dev)
        alias: uv-export-dev
        args: ["--frozen", "--output-file=requirements-dev.txt", "--quiet"]
