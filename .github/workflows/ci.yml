name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-lint-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          # ty has its own job, and the --locked syncs in the other jobs already catch a stale uv.lock.
          SKIP: ty,uv-lock,uv-export

  typing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-suffix: all-groups
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-typing-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv sync --locked --all-groups
      - run: uvx pre-commit run ty --all-files

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-suffix: runtime
      # Production installs only the runtime dependencies, so an import that only the
      # dev group satisfies (Red's undeclared pip) has to fail here, not on the host.
      - run: uv sync --locked --no-dev
      - run: uv run --no-sync python -c "import redbot.__main__, redbot.core.bot, rsc"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked pytest -n auto
